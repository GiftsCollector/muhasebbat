<style>
  .print-watermark {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 0;
  }
  .print-watermark img {
    width: min(68vw, 560px);
    max-height: 70vh;
    object-fit: contain;
    opacity: 0.07;
  }
  body { position: relative; }
  body > *:not(.print-watermark) { position: relative; z-index: 1; }
</style>
<div class="print-watermark" aria-hidden="true">
  <img src="{{ url_for('static', filename='company-logo-transparent.png') }}" alt=""
       onerror="if(!this.dataset.fallback){this.dataset.fallback='1';this.src='{{ url_for('static', filename='company-logo-desktop.png') }}';}else{this.style.display='none';}">
</div>
