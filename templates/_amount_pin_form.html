<form method="post" action="{{ url_for('update_admin_amount_pin') }}" class="row g-3">
  <div class="col-12">
    {% if pin_is_custom %}
      <p class="small text-muted mb-0">اكتبه الحالي وبعدين الرقم الجديد الخاص بحسابك.</p>
    {% else %}
      <p class="small text-muted mb-0">الرقم الحالي الافتراضي لكل المستخدمين: <strong>{{ default_amount_pin }}</strong></p>
    {% endif %}
  </div>
  <div class="col-md-4">
    <label class="form-label">الرقم السري الحالي</label>
    <input type="password" class="form-control" name="current_pin" required autocomplete="off" inputmode="numeric">
  </div>
  <div class="col-md-4">
    <label class="form-label">الرقم السري الجديد</label>
    <input type="password" class="form-control" name="new_pin" required minlength="4" autocomplete="off" inputmode="numeric">
  </div>
  <div class="col-md-4">
    <label class="form-label">تأكيد الرقم الجديد</label>
    <input type="password" class="form-control" name="confirm_pin" required minlength="4" autocomplete="off" inputmode="numeric">
  </div>
  <div class="col-12">
    <button type="submit" class="btn btn-cyan">حفظ الرقم السري</button>
  </div>
</form>
