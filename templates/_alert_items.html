{% for item in alerts %}
  <div class="ops-alert ops-alert-{{ item.severity }}">
    <a class="ops-alert-body" href="{{ item.url }}">
      <strong>{{ item.title }}</strong>
      <span>{{ item.detail }}</span>
    </a>
    <form method="post" action="{{ url_for('dismiss_user_alert') }}" class="m-0">
      <input type="hidden" name="alert_key" value="{{ item.key }}">
      <input type="hidden" name="next" value="{{ request.path }}">
      <button type="submit" class="btn btn-sm btn-outline-light" title="إخفاء لحد ما الحالة تتغير">إخفاء</button>
    </form>
  </div>
{% else %}
  <div class="text-muted small py-2">مفيش تنبيه محتاج تصرف دلوقتي.</div>
{% endfor %}
