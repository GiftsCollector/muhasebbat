<div class="no-print">
  <button type="button" onclick="window.print()">طباعة / حفظ PDF</button>
</div>
<script>
(function () {
  function hideBrowserChrome() { document.title = '\u200b'; }
  hideBrowserChrome();
  window.addEventListener('beforeprint', hideBrowserChrome);
  window.addEventListener('load', function () {
    hideBrowserChrome();
    window.setTimeout(function () {
      hideBrowserChrome();
      window.print();
    }, 250);
  });
})();
</script>
