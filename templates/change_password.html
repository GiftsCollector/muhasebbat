{% extends 'layout.html' %}
{% block content %}
<div class="row justify-content-center fade-up">
  <div class="col-lg-5 col-md-8">
    <div class="glass-card p-4 shadow-sm">
      <h3 class="section-title mb-3">تغيير كلمة المرور</h3>
      <p class="text-muted mb-4">كلمة المرور خاصة بحسابك. لا تستخدم 123456.</p>
      <form method="post" class="row g-3">
        <div class="col-12">
          <label class="form-label">كلمة المرور الحالية</label>
          <input type="password" class="form-control" name="current_password" required autocomplete="current-password">
        </div>
        <div class="col-12">
          <label class="form-label">كلمة المرور الجديدة</label>
          <input type="password" class="form-control" name="new_password" required minlength="6" autocomplete="new-password">
        </div>
        <div class="col-12">
          <label class="form-label">تأكيد كلمة المرور الجديدة</label>
          <input type="password" class="form-control" name="confirm_password" required minlength="6" autocomplete="new-password">
        </div>
        <div class="col-12 d-grid">
          <button class="btn btn-cyan btn-lg">حفظ كلمة المرور</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
