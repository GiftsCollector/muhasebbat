{% extends 'layout.html' %}
{% block content %}
<div class="row gy-4 fade-up">
  <div class="col-lg-8 mx-auto">
    <div class="glass-card p-4">
      <h2 class="section-title">النسخ الاحتياطي والاستعادة</h2>
      <p class="text-muted">حمّل نسخة ZIP تضم بيانات الجداول ومرفقات الفواتير. الاستعادة الكاملة تستبدل بيانات القاعدة الحالية بعد التأكيد.</p>
      <div class="d-flex flex-wrap gap-2 mb-4">
        <a class="btn btn-primary" href="{{ url_for('download_backup') }}">تنزيل نسخة احتياطية</a>
      </div>
      <form method="post" enctype="multipart/form-data">
        <label class="form-label">رفع نسخة ZIP</label>
        <input type="file" class="form-control mb-3" name="backup_file" accept=".zip" required>
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" name="confirm_restore" id="confirmRestore">
          <label class="form-check-label text-danger" for="confirmRestore">أؤكد استبدال كل البيانات الحالية بهذه النسخة</label>
        </div>
        <button class="btn btn-outline-light">فحص أو استعادة</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
