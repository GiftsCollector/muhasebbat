<style>
  @page {
    margin: 0;
  }
  * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  html, body {
    margin: 0;
    padding: 0;
  }
  body {
    font-family: Tahoma, "Segoe UI", Arial, sans-serif;
    color: #102033;
    font-size: 12px;
    font-weight: 600;
    background: #fff;
  }
  .print-frame {
    margin: 10mm 12mm;
    border: 2px solid #1d4f91;
    padding: 12px 14px 14px;
    min-height: calc(100vh - 20mm);
  }
  .print-letterhead {
    display: grid;
    grid-template-columns: 84px minmax(0, 1fr) 118px;
    align-items: start;
    column-gap: 10px;
    min-height: 0;
    padding: 0 0 8px;
    margin: 0 0 10px;
    border-bottom: 2px solid #1d4f91;
    direction: ltr;
  }
  .print-brand-logo { text-align: left; min-width: 0; }
  .print-logo { height: 48px; max-width: 84px; object-fit: contain; }
  .print-company {
    text-align: right;
    direction: rtl;
    min-width: 0;
    overflow: hidden;
  }
  .print-company-name {
    font-size: 10px;
    font-weight: 800;
    color: #1d4f91;
    line-height: 1.25;
    overflow-wrap: anywhere;
  }
  .print-company-dept {
    margin-top: 2px;
    font-size: 9px;
    font-weight: 700;
    color: #334155;
  }
  .print-doc-center {
    position: static;
    width: auto;
    max-width: none;
    min-width: 0;
    text-align: center;
    direction: rtl;
    overflow: hidden;
  }
  .print-doc-title,
  .print-doc-sub,
  .print-doc-stamp {
    margin: 0;
    text-align: center;
  }
  .print-doc-title {
    font-size: 12px;
    font-weight: 800;
    color: #1d4f91;
    line-height: 1.3;
    overflow-wrap: anywhere;
  }
  .print-doc-sub {
    margin-top: 2px;
    font-size: 9px;
    font-weight: 700;
    color: #1e3a5f;
    line-height: 1.3;
    overflow-wrap: anywhere;
  }
  .print-doc-stamp {
    margin-top: 2px;
    font-size: 9px;
    font-weight: 700;
    color: #334155;
  }
  .print-meta {
    display: block;
    width: 100%;
    text-align: center;
    margin: 0 0 10px;
    font-size: 12px;
    font-weight: 700;
    color: #334155;
  }
  .print-frame h2, .print-frame h3 {
    text-align: center;
  }
  .print-kpis, .totals {
    display: flex;
    gap: 8px;
    margin: 0 0 10px;
    flex-wrap: wrap;
  }
  .print-kpis > div, .totals > div, .print-kpi {
    flex: 1;
    min-width: 110px;
    border: 1px solid #1d4f91;
    padding: 7px 8px;
    text-align: center;
    font-weight: 700;
  }
  .print-kpis span, .totals span {
    display: block;
    font-size: 11px;
    font-weight: 700;
    color: #475569;
  }
  .print-kpis strong, .totals strong {
    display: block;
    margin-top: 2px;
    font-size: 14px;
    font-weight: 800;
  }
  table.print-table, .print-frame table, .sheet table {
    width: 100%;
    border-collapse: collapse;
  }
  table.print-table th, table.print-table td,
  .print-frame table th, .print-frame table td,
  .sheet table th, .sheet table td {
    border: 1px solid #7f9abf;
    padding: 5px 6px;
    font-size: 11px;
    font-weight: 700;
    text-align: right;
    vertical-align: top;
  }
  table.print-table th,
  .print-frame table th,
  .sheet table th {
    background: #1d4f91;
    color: #fff;
    font-weight: 800;
  }
  tfoot td { font-weight: 800; background: #e8f0fa; }
  .print-emp {
    font-weight: 800;
    line-height: 1.35;
  }
  .print-emp-sub {
    display: block;
    margin-top: 2px;
    font-size: 10px;
    font-weight: 700;
    color: #334155;
  }
  table.payroll-print {
    table-layout: auto;
  }
  table.payroll-print th, table.payroll-print td {
    font-size: 9px;
    padding: 3px 3px;
    white-space: nowrap;
    text-align: center;
    vertical-align: middle;
  }
  table.payroll-print td.print-emp-cell,
  table.payroll-print td.print-meta-cell {
    white-space: normal;
    text-align: right;
    min-width: 72px;
  }
  .print-signs {
    display: flex;
    justify-content: space-around;
    gap: 24px;
    margin-top: 28px;
    page-break-inside: avoid;
  }
  .print-sign {
    text-align: center;
    min-width: 180px;
    font-weight: 700;
  }
  .print-sign strong { display: block; font-size: 13px; color: #1d4f91; }
  .print-sign-name { display: block; margin-top: 6px; font-size: 12px; font-weight: 800; }
  .print-sign-line {
    display: block;
    margin-top: 28px;
    border-top: 1px solid #64748b;
    padding-top: 4px;
    font-size: 11px;
    color: #475569;
  }
  .no-print { margin: 8px 12px; }
  .no-print button { font-weight: 700; padding: 6px 12px; }
  .no-print .hint { font-size: 11px; color: #475569; margin-right: 8px; }
  @media print {
    .no-print { display: none !important; }
    a[href]:after { content: none !important; }
    .print-frame { min-height: auto; }
  }
</style>
