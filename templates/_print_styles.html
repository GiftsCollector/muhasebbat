<style>
  @page {
    size: A4 portrait;
    margin: 10mm 9mm 12mm;
    @top-left { content: none; }
    @top-center { content: none; }
    @top-right { content: none; }
    @bottom-left { content: none; }
    @bottom-center { content: none; }
    @bottom-right { content: none; }
  }
  * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body {
    font-family: Tahoma, "Segoe UI", Arial, sans-serif;
    color: #102033;
    margin: 0;
    font-size: 12px;
    font-weight: 600;
  }
  .print-letterhead {
    display: grid;
    grid-template-columns: 110px 1fr 220px;
    align-items: center;
    gap: 10px;
    padding-bottom: 8px;
    margin-bottom: 10px;
    border-bottom: 2px solid #1d4f91;
    direction: ltr;
  }
  .print-brand-logo { text-align: left; }
  .print-logo { height: 62px; max-width: 110px; object-fit: contain; }
  .print-doc-center { text-align: center; direction: rtl; }
  .print-doc-title {
    margin: 0;
    font-size: 18px;
    font-weight: 800;
    color: #1d4f91;
    line-height: 1.35;
  }
  .print-doc-stamp {
    margin-top: 4px;
    font-size: 12px;
    font-weight: 700;
    color: #1e3a5f;
  }
  .print-company { text-align: right; direction: rtl; }
  .print-company-name {
    font-size: 16px;
    font-weight: 800;
    color: #1d4f91;
    line-height: 1.4;
  }
  .print-company-dept {
    margin-top: 3px;
    font-size: 13px;
    font-weight: 700;
    color: #334155;
  }
  .print-meta {
    text-align: center;
    margin: 0 0 10px;
    font-size: 12px;
    font-weight: 700;
    color: #334155;
  }
  .print-kpis, .totals {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .print-kpis > div, .totals > div, .print-kpi {
    flex: 1;
    min-width: 120px;
    border: 1px solid #1d4f91;
    padding: 7px 8px;
    text-align: center;
    font-weight: 700;
  }
  .print-kpis span, .totals span {
    display: block;
    font-size: 11px;
    font-weight: 700;
    color: #475569;
  }
  .print-kpis strong, .totals strong {
    display: block;
    margin-top: 2px;
    font-size: 14px;
    font-weight: 800;
  }
  table.print-table, .print-page table, body > table, .sheet table {
    width: 100%;
    border-collapse: collapse;
  }
  table.print-table th, table.print-table td,
  .print-page table th, .print-page table td,
  body > table th, body > table td,
  .sheet table th, .sheet table td {
    border: 1px solid #7f9abf;
    padding: 5px 6px;
    font-size: 11px;
    font-weight: 700;
    text-align: right;
    vertical-align: top;
  }
  table.print-table th,
  .print-page table th,
  body > table th,
  .sheet table th {
    background: #1d4f91;
    color: #fff;
    font-weight: 800;
  }
  tfoot td { font-weight: 800; background: #e8f0fa; }
  .print-signs {
    display: flex;
    justify-content: space-around;
    gap: 24px;
    margin-top: 28px;
    page-break-inside: avoid;
  }
  .print-sign {
    text-align: center;
    min-width: 180px;
    font-weight: 700;
  }
  .print-sign strong { display: block; font-size: 13px; color: #1d4f91; }
  .print-sign-name { display: block; margin-top: 6px; font-size: 12px; font-weight: 800; }
  .print-sign-line {
    display: block;
    margin-top: 28px;
    border-top: 1px solid #64748b;
    padding-top: 4px;
    font-size: 11px;
    color: #475569;
  }
  .no-print { margin-bottom: 8px; }
  .no-print button {
    font-weight: 700;
    padding: 6px 12px;
  }
  .no-print .hint { font-size: 11px; color: #475569; margin-right: 8px; }
  @media print {
    .no-print { display: none !important; }
    a[href]:after { content: none !important; }
  }
</style>
