{% extends 'layout.html' %}
{% block content %}
<div class="row gy-4 fade-up">
  <div class="col-12">
    <div class="glass-card p-4 shadow-sm">
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-start gap-3">
        <div>
          <h2 class="section-title">التنبيهات</h2>
          <p class="text-muted mb-0">حالات تحتاج تصرف من البيانات المسجّلة. الإخفاء يخفي نفس الحالة، ولو اتغيّرت هترجع.</p>
        </div>
        <span class="badge bg-secondary py-2 px-3">{{ alerts|length }} تنبيه</span>
      </div>
    </div>
  </div>
  <div class="col-12">
    <div class="glass-card p-4 shadow-sm">
      {% include '_alert_items.html' %}
    </div>
  </div>
</div>
{% endblock %}
