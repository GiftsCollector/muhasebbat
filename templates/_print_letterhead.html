{% include '_print_styles.html' %}
<header class="print-letterhead">
  <div class="print-brand-logo">
    <img class="print-logo" src="{{ url_for('static', filename='company-logo-desktop.png') }}" alt=""
         onerror="if(!this.dataset.fallback){this.dataset.fallback='1';this.src='{{ url_for('static', filename='company-logo-transparent.png') }}';}else{this.style.display='none';}">
  </div>
  <div class="print-doc-center">
    <h1 class="print-doc-title">{{ print_title or 'تقرير' }}</h1>
    <div class="print-doc-stamp">
      {% if weekday_name %}{{ weekday_name }} — {% endif %}{{ print_date or '' }}
      {% if print_time %} · {{ print_time }}{% endif %}
    </div>
  </div>
  <div class="print-company">
    <div class="print-company-name">{{ company_name or 'شركة السيد الشيخ للمقاولات العمومية' }}</div>
    <div class="print-company-dept">{{ print_department or 'قسم الحسابات' }}</div>
  </div>
</header>
